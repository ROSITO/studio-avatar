name: Bug report
description: Report a reproducible problem in Studio Avatar.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove personal media, paths, credentials, and private project data. Report vulnerabilities using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal example with synthetic content.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, FFmpeg, Studio Avatar commit, and relevant engine versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Never include personal portraits, voices, project files, or secrets.
