name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install numpy
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Compile Python
        run: python -m py_compile studio.py projets.py modeles.py apercus.py montage.py lancer_musetalk15.py visage.py voix.py lancer_voix.py drama_memoire.py drama_cache.py installer_voix.py lancer_omnivoice.py memoire.py balises.py
      - name: Test persistent timeline and media assembly
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Validate browser script syntax
        run: node -e 'const fs = require("fs"); new Function(fs.readFileSync("index.html", "utf8").split("<script>")[1].split("</script>")[0]);'
      - name: Test generation progress parsing
        run: node test_progression.js && node test_balises.js && node test_voix_lot.js && node test_import_photo.js && node test_modeles.js && node test_plateforme.js
      - name: Verify publication boundary
        run: python tools/check_publication.py
  windows-launcher:
    name: Windows launcher and architecture detection
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: studio avatar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: studio avatar
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate Windows bootstrap syntax
        shell: powershell
        run: |
          $parseErrors = $null
          foreach ($file in @('windows.ps1', 'windows-downloads.ps1', 'test_windows_downloads.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Test direct downloads without network or WinGet
        shell: powershell
        run: .\test_windows_downloads.ps1
      - name: Report installation plan without installing models
        run: call .\installer.bat --plan < NUL
        shell: cmd
      - name: Run the Windows prerequisite bootstrap
        run: call .\installer.bat --engine interface < NUL
        shell: cmd
      - name: Verify installer selection and batch launcher
        run: python -m unittest test_deploiement test_import_photo -v
      - name: Install and verify Windows CPU voice runtime (no model weights)
        run: call .\installer.bat --engine omnivoice --device cpu < NUL
        shell: cmd
      - name: Install and verify separate Windows Qwen runtime (no weights)
        run: call .\installer.bat --engine qwen-tts --device cpu < NUL
        shell: cmd
  windows-native-imports:
    name: Windows native ${{ matrix.engine }} imports
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [ltx, image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install CPU wheels for import-only validation
        run: python -m pip install torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install isolated native dependencies (no weights)
        run: python -m pip install -r requirements-${{ matrix.engine }}.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Import native LTX
        if: matrix.engine == 'ltx'
        run: python -c "import cv2; assert not cv2.CascadeClassifier(cv2.data.haarcascades + 'haarcascade_frontalface_default.xml').empty(); import ltx_pipelines.ti2vid_two_stages, ltx_pipelines.a2vid_two_stage"
      - name: Test real Windows LTX staging allocation without CUDA hardware
        if: matrix.engine == 'ltx'
        run: python -m unittest test_ltx_windows_runtime -v
      - name: Import native FLUX
        if: matrix.engine == 'image'
        run: python -c "from diffusers import Flux2KleinPipeline"
